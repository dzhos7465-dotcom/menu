<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<style>
  :root{ --bg:#0d1f18; --gold:#f2c879; --gold-soft:rgba(242,200,121,.55); --ar:0.7071; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);
    font-family:"Trebuchet MS",-apple-system,system-ui,sans-serif;position:fixed;inset:0;}
  body{display:flex;flex-direction:column;
    background:radial-gradient(circle at 50% 25%,#163326 0%,#0d1f18 72%);}

  .stage{flex:1;position:relative;overflow:hidden;min-height:0;}
  .book{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);perspective:1700px;}

  .sheet{position:absolute;inset:0;transform-style:preserve-3d;
    transform-origin:left center;will-change:transform;}
  .sheet.anim{transition:transform .74s cubic-bezier(.55,.03,.26,1);}
  .sheet .face{position:absolute;inset:0;backface-visibility:hidden;
    -webkit-backface-visibility:hidden;border-radius:8px;overflow:hidden;
    box-shadow:0 22px 55px rgba(0,0,0,.55),0 3px 10px rgba(0,0,0,.4);background:var(--bg);}
  .sheet .face img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none;}
  .sheet .front{transform:rotateY(0deg);}
  .sheet .back{transform:rotateY(180deg);}

  /* ==== bending look: a soft curved shadow + a moving highlight band ==== */
  /* darkening near the spine that grows as the page lifts -> reads as a curl */
  .sheet .curve{position:absolute;inset:0;pointer-events:none;border-radius:8px;opacity:0;
    background:
      radial-gradient(120% 100% at 0% 50%, rgba(0,0,0,.55), rgba(0,0,0,0) 42%),
      linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,0) 30%);}
  /* a soft light band that sweeps across like light bending on paper */
  .sheet .band{position:absolute;inset:0;pointer-events:none;border-radius:8px;opacity:0;
    background:linear-gradient(100deg,
      rgba(255,255,255,0) 30%,
      rgba(255,255,255,.14) 48%,
      rgba(255,255,255,.04) 56%,
      rgba(255,255,255,0) 70%);}
  /* the back (underside) gets a gentle shading too */
  .sheet .under{position:absolute;inset:0;pointer-events:none;border-radius:8px;opacity:0;
    background:linear-gradient(270deg, rgba(0,0,0,.45), rgba(0,0,0,0) 45%);}

  /* ==== smoke / steam ==== */
  .smoke{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden;border-radius:8px;}
  .puff{position:absolute;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.40),rgba(255,255,255,.15) 45%,rgba(255,255,255,0) 72%);
    filter:blur(7px);opacity:0;mix-blend-mode:screen;animation:rise linear infinite;}
  @keyframes rise{
    0%{transform:translateY(24px) scale(.65);opacity:0;}
    22%{opacity:.8;}
    65%{opacity:.48;}
    100%{transform:translateY(-160px) scale(1.8);opacity:0;}
  }
  .smoke.boost .puff{animation-duration:3.2s!important;}

  /* ==== live "breathing" food that reacts to touch ==== */
  .live{position:absolute;pointer-events:auto;overflow:hidden;cursor:pointer;
    transition:transform .35s cubic-bezier(.34,1.4,.5,1);}
  .live .zoomimg{position:absolute;background-repeat:no-repeat;
    animation:breathe 5.5s ease-in-out infinite;transition:transform .35s ease;}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
  .live.tapped{transform:scale(1.06);}
  .live.tapped .zoomimg{animation-duration:1.6s;}
  .ring{position:absolute;border-radius:50%;pointer-events:none;border:2px solid var(--gold);
    opacity:0;transform:scale(.6);}
  .ring.go{animation:ripple .6s ease-out;}
  @keyframes ripple{0%{opacity:.6;transform:scale(.6);}100%{opacity:0;transform:scale(1.25);}}
  .glint{position:absolute;pointer-events:none;overflow:hidden;}
  .glint::after{content:"";position:absolute;top:-40%;left:-60%;width:55%;height:180%;
    background:linear-gradient(105deg,rgba(255,255,255,0),rgba(255,255,255,.16) 50%,rgba(255,255,255,0));
    transform:rotate(8deg);animation:sweep 7.5s ease-in-out infinite;}
  .glint.flash::after{animation:sweepOnce .55s ease-out;}
  @keyframes sweep{0%,74%{left:-60%;}88%,100%{left:120%;}}
  @keyframes sweepOnce{0%{left:-60%;}100%{left:120%;}}

  /* contact hot-zones */
  .hot{position:absolute;z-index:8;display:block;border-radius:9px;border:1.5px solid transparent;}
  .hot.glow{animation:tapGlow 1.9s ease-in-out infinite;}
  @keyframes tapGlow{
    0%,100%{box-shadow:0 0 0 0 rgba(242,200,121,0);border-color:rgba(242,200,121,.12);background:rgba(242,200,121,.03);}
    50%{box-shadow:0 0 13px 2px rgba(242,200,121,.42);border-color:rgba(242,200,121,.65);background:rgba(242,200,121,.10);}
  }
  .hot:active{background:rgba(242,200,121,.25)!important;}
  .tapcue{position:absolute;z-index:9;pointer-events:none;display:flex;align-items:center;gap:6px;
    font-size:11px;letter-spacing:.08em;color:#0d1f18;font-weight:bold;background:var(--gold);
    padding:4px 10px;border-radius:20px;box-shadow:0 3px 10px rgba(0,0,0,.4);
    opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s;white-space:nowrap;}
  .tapcue.show{opacity:.95;transform:translateY(0);}
  .tapcue svg{width:13px;height:13px;fill:#0d1f18;}

  .nav{position:absolute;top:0;bottom:0;width:16%;max-width:130px;z-index:20;display:flex;
    align-items:center;border:none;background:transparent;cursor:pointer;opacity:0;transition:opacity .25s;}
  .stage:hover .nav{opacity:1;}
  .nav.left{left:0;justify-content:flex-start;padding-left:16px;}
  .nav.right{right:0;justify-content:flex-end;padding-right:16px;}
  .nav .chev{width:54px;height:54px;border-radius:50%;background:rgba(13,31,24,.55);
    backdrop-filter:blur(6px);border:1px solid var(--gold-soft);display:flex;align-items:center;
    justify-content:center;transition:transform .2s,background .2s;}
  .nav:hover .chev{background:rgba(13,31,24,.85);transform:scale(1.08);}
  .nav .chev svg{width:24px;height:24px;stroke:var(--gold);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .nav[disabled]{opacity:0!important;pointer-events:none;}

  .bar{flex:0 0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:7px;}
  .dots{display:flex;gap:10px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--gold-soft);opacity:.45;
    transition:opacity .3s,transform .3s,background .3s;cursor:pointer;}
  .dot.on{opacity:1;background:var(--gold);transform:scale(1.25);}
  .counter{font-size:12px;letter-spacing:.18em;color:var(--gold);opacity:.75;font-weight:bold;}

  .hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;color:var(--gold);
    font-size:13px;letter-spacing:.14em;background:rgba(13,31,24,.6);backdrop-filter:blur(6px);
    padding:9px 18px;border-radius:30px;border:1px solid var(--gold-soft);display:flex;align-items:center;
    gap:9px;animation:hintPulse 1.7s ease-in-out infinite;transition:opacity .5s;}
  .hint svg{width:20px;height:20px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  @keyframes hintPulse{0%,100%{transform:translateX(-50%) translateX(-6px);}50%{transform:translateX(-50%) translateX(6px);}}
  .hint.hide{opacity:0;pointer-events:none;}

  @media (max-height:520px){
    .bar{padding:6px 16px calc(6px + env(safe-area-inset-bottom));gap:5px;}
    .hint{bottom:10px;padding:7px 14px;font-size:12px;}
  }
  @media (prefers-reduced-motion:reduce){
    .sheet.anim{transition:transform .3s ease;}
    .puff,.hot.glow,.zoomimg,.glint::after,.hint{animation:none;}
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="book" id="book"></div>

    <button class="nav left" id="prev" aria-label="Назад" disabled>
      <span class="chev"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></span>
    </button>
    <button class="nav right" id="next" aria-label="Вперёд">
      <span class="chev"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>
    </button>

    <div class="hint" id="hint">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      тяните, чтобы листать
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
  </div>

  <div class="bar">
    <div class="dots" id="dots"></div>
    <div class="counter" id="counter">1 / 3</div>
  </div>

<script>
(function(){
  const IMAGES=['1.jpg','2.jpg','3.jpg'];
  const AR=0.7071;
  const total=IMAGES.length;

  const WHATSAPP='https://wa.me/79280168111';
  const INSTAGRAM='https://www.instagram.com/_burgerzona_';
  const HOTZONES=[
    {href:WHATSAPP , x:0.045, y:0.910, w:0.245, h:0.034, label:'Написать в WhatsApp'},
    {href:INSTAGRAM, x:0.045, y:0.949, w:0.235, h:0.034, label:'Открыть Instagram'}
  ];
  const LIVE={
    0:[[0.80,0.20,0.19],[0.27,0.72,0.20]],
    1:[[0.66,0.36,0.24],[0.28,0.80,0.17]],
    2:[[0.86,0.80,0.18]]
  };
  const SMOKE={
    0:[[0.80,0.24],[0.30,0.66]],
    1:[[0.66,0.40],[0.30,0.78]],
    2:[[0.86,0.74]]
  };

  let i=0, animating=false, bookW=1, bookH=1;
  const stage=document.getElementById('stage');
  const book=document.getElementById('book');
  const prevBtn=document.getElementById('prev');
  const nextBtn=document.getElementById('next');
  const dotsWrap=document.getElementById('dots');
  const counter=document.getElementById('counter');
  const hint=document.getElementById('hint');

  const sheets=[];
  for(let idx=0;idx<total;idx++){
    const s=document.createElement('div');
    s.className='sheet anim';
    s.style.zIndex=total-idx;
    const frontSrc=IMAGES[idx];
    const backSrc=IMAGES[idx+1]||IMAGES[idx];
    s.innerHTML=
      '<div class="face front"><img src="'+frontSrc+'" alt="Меню, страница '+(idx+1)+'">'+
        '<div class="smoke" data-page="'+idx+'"></div>'+
        '<div class="livewrap" data-page="'+idx+'"></div>'+
        (idx===total-1?'<div class="hotwrap"></div>':'')+
        '<div class="curve"></div><div class="band"></div>'+
      '</div>'+
      '<div class="face back"><img src="'+backSrc+'" alt=""><div class="under"></div></div>';
    book.appendChild(s);
    sheets.push(s);
  }

  for(let idx=0;idx<total;idx++){
    const d=document.createElement('div');
    d.className='dot'+(idx===0?' on':'');
    d.addEventListener('click',()=>jump(idx));
    dotsWrap.appendChild(d);
  }
  const dots=[...dotsWrap.children];

  function fit(){
    const availW=stage.clientWidth*0.94;
    const availH=stage.clientHeight*0.94;
    let w=availH*AR, h=availH;
    if(w>availW){ w=availW; h=availW/AR; }
    bookW=w; bookH=h;
    book.style.width=w+'px'; book.style.height=h+'px';
    buildDecor();
  }
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',()=>{setTimeout(fit,150);setTimeout(fit,400);});

  function buildDecor(){
    sheets.forEach((s,idx)=>{
      // smoke
      const sm=s.querySelector('.smoke');
      let smHtml='';
      (SMOKE[idx]||[]).forEach((sp,k)=>{
        for(let n=0;n<3;n++){
          const size=64+Math.random()*46;
          const left=(sp[0]*100)+(Math.random()*8-4);
          const top=(sp[1]*100)+(Math.random()*6-3);
          const dur=6+Math.random()*3.5;
          const delay=(k*1.4+n*1.7+Math.random()).toFixed(2);
          smHtml+='<div class="puff" style="left:'+left+'%;top:'+top+'%;width:'+size+'px;height:'+size+'px;'+
                  'animation-duration:'+dur+'s;animation-delay:'+delay+'s"></div>';
        }
      });
      sm.innerHTML=smHtml;

      // live food discs (interactive)
      const lw=s.querySelector('.livewrap');
      let lvHtml='';
      (LIVE[idx]||[]).forEach((r,idx2)=>{
        const cx=r[0],cy=r[1],rad=r[2];
        const d=rad*2*bookW;
        const left=(cx*bookW - d/2);
        const top=(cy*bookH - d/2);
        const posX=-(cx*bookW - d/2);
        const posY=-(cy*bookH - d/2);
        const mask='-webkit-mask:radial-gradient(circle at 50% 50%,#000 55%,transparent 72%);mask:radial-gradient(circle at 50% 50%,#000 55%,transparent 72%)';
        lvHtml+='<div class="live" data-spot="'+idx+'-'+idx2+'" style="left:'+left+'px;top:'+top+'px;width:'+d+'px;height:'+d+'px;'+mask+'">'+
                '<div class="zoomimg" style="left:0;top:0;width:'+d+'px;height:'+d+'px;'+
                'background-image:url('+IMAGES[idx]+');background-size:'+bookW+'px '+bookH+'px;'+
                'background-position:'+posX+'px '+posY+'px;animation-delay:'+(idx2*1.3)+'s"></div></div>';
        lvHtml+='<div class="glint" data-glint="'+idx+'-'+idx2+'" style="left:'+left+'px;top:'+top+'px;width:'+d+'px;height:'+d+'px;'+mask+'"></div>';
        lvHtml+='<div class="ring" data-ring="'+idx+'-'+idx2+'" style="left:'+left+'px;top:'+top+'px;width:'+d+'px;height:'+d+'px"></div>';
      });
      lw.innerHTML=lvHtml;

      // hotzones on last page
      const hw=s.querySelector('.hotwrap');
      if(hw){
        let hz=HOTZONES.map(z=>
          '<a class="hot glow" href="'+z.href+'" target="_blank" rel="noopener" aria-label="'+z.label+'" '+
          'style="left:'+(z.x*100)+'%;top:'+(z.y*100)+'%;width:'+(z.w*100)+'%;height:'+(z.h*100)+'%"></a>'
        ).join('');
        hz+='<div class="tapcue" style="left:'+(HOTZONES[0].x*100)+'%;top:'+((HOTZONES[1].y+HOTZONES[1].h+0.006)*100)+'%">'+
            '<svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V12m0-1a1.5 1.5 0 0 1 3 0v4a5 5 0 0 1-5 5h-2a5 5 0 0 1-4.3-2.4L4 15c-.5-1 .4-2 1.4-1.6L8 15V6a1.5 1.5 0 0 1 3 0"/></svg>нажми, чтобы связаться</div>';
        hw.innerHTML=hz;
      }
    });
    bindLive();
    updateCue();
  }

  /* ===== interactive food: tap/hover to animate ===== */
  function bindLive(){
    document.querySelectorAll('.live').forEach(el=>{
      const spot=el.dataset.spot;
      const glint=document.querySelector('.glint[data-glint="'+spot+'"]');
      const ring=document.querySelector('.ring[data-ring="'+spot+'"]');
      const smoke=el.closest('.face').querySelector('.smoke');
      const fire=()=>{
        el.classList.add('tapped');
        if(glint){glint.classList.remove('flash');void glint.offsetWidth;glint.classList.add('flash');}
        if(ring){ring.classList.remove('go');void ring.offsetWidth;ring.classList.add('go');}
        if(smoke){smoke.classList.add('boost');}
        clearTimeout(el._t);
        el._t=setTimeout(()=>{el.classList.remove('tapped');if(smoke)smoke.classList.remove('boost');},900);
      };
      el.addEventListener('click',fire);
      el.addEventListener('mouseenter',fire);
      el.addEventListener('touchstart',fire,{passive:true});
    });
  }

  function updateCue(){
    const last=sheets[total-1];
    const tc=last&&last.querySelector('.tapcue');
    if(!tc)return;
    if(i===total-1){ tc.classList.add('show'); setTimeout(()=>tc.classList.remove('show'),4200); }
    else tc.classList.remove('show');
  }

  function updateChrome(){
    dots.forEach((d,idx)=>d.classList.toggle('on',idx===i));
    counter.textContent=(i+1)+' / '+total;
    prevBtn.disabled=(i===0);
    nextBtn.disabled=(i===total-1);
    updateCue();
  }

  /* apply the "bending" visuals for progress p (0 flat .. 1 turned) */
  function bendFx(sheet,p){
    const curve=sheet.querySelector('.curve');
    const band=sheet.querySelector('.band');
    const under=sheet.querySelector('.under');
    // curl shadow deepens toward mid-turn then eases
    const c=Math.sin(p*Math.PI);
    if(curve)curve.style.opacity=(0.25+0.6*p).toFixed(3);
    if(band)band.style.opacity=(0.9*c).toFixed(3);
    if(under)under.style.opacity=(0.5*p).toFixed(3);
    // subtle vertical "lift": scale the sheet a touch in Y at mid-turn to fake a bow
    const bow=1 - 0.03*c;
    sheet.style.setProperty('--bow',bow);
  }
  function clearBend(sheet){
    ['.curve','.band','.under'].forEach(sel=>{
      const el=sheet.querySelector(sel);
      if(el){el.style.transition='';el.style.opacity='';}
    });
  }

  function animateTo(sheet,targetDeg,cb){
    sheet.classList.add('anim');
    const p=Math.abs(targetDeg)/180;
    const curve=sheet.querySelector('.curve');
    const band=sheet.querySelector('.band');
    const under=sheet.querySelector('.under');
    // transition the bending layers alongside the rotation
    if(curve)curve.style.transition='opacity .74s';
    if(under)under.style.transition='opacity .74s';
    if(band){ // band sweeps: quick to mid then fade
      band.style.transition='opacity .74s';
    }
    requestAnimationFrame(()=>{
      sheet.style.transform='rotateY('+targetDeg+'deg)';
      if(curve)curve.style.opacity=(0.25+0.6*p).toFixed(3);
      if(under)under.style.opacity=(0.5*p).toFixed(3);
      if(band)band.style.opacity=0; // ends dark->0; mid-peak comes from the drag path
    });
    // fire a mid-turn shine
    if(band){ band.style.opacity='0.85'; setTimeout(()=>{band.style.opacity='0';},360); }
    setTimeout(()=>{ if(cb)cb(); },740);
  }

  function next(){
    if(animating||i>=total-1)return;
    animating=true;hideHint();
    const s=sheets[i];
    s.style.zIndex=total+2;
    animateTo(s,-180,()=>{ i++;updateChrome();animating=false; });
  }
  function prev(){
    if(animating||i<=0)return;
    animating=true;hideHint();
    const s=sheets[i-1];
    s.style.zIndex=total+2;
    animateTo(s,0,()=>{ s.style.zIndex=total-(i-1);clearBend(s);i--;updateChrome();animating=false; });
  }
  function jump(target){
    if(animating||target===i)return;
    const step=()=>{ if(i<target)next();else if(i>target)prev();
      if(i!==target)setTimeout(step,120); };
    step();
  }
  function hideHint(){hint.classList.add('hide');}

  prevBtn.addEventListener('click',prev);
  nextBtn.addEventListener('click',next);
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight')next(); if(e.key==='ArrowLeft')prev();
  });

  /* ===== drag to turn (page follows finger) with live bend ===== */
  let dragging=false,decided=false,dir=0,startX=0,startY=0,curDeg=0,dragSheet=null;
  stage.addEventListener('touchstart',onDown,{passive:true});
  stage.addEventListener('touchmove',onMove,{passive:false});
  stage.addEventListener('touchend',onUp,{passive:true});
  stage.addEventListener('mousedown',onDown);
  window.addEventListener('mousemove',e=>{if(dragging)onMove(e);});
  window.addEventListener('mouseup',onUp);
  function px(e){return e.touches?e.touches[0].clientX:e.clientX;}
  function py(e){return e.touches?e.touches[0].clientY:e.clientY;}

  function onDown(e){
    if(animating)return;
    if(e.target&&e.target.closest&&(e.target.closest('.hot')||e.target.closest('.live')))return;
    startX=px(e);startY=py(e);dragging=true;decided=false;dir=0;dragSheet=null;
  }
  function onMove(e){
    if(!dragging)return;
    const dx=px(e)-startX, dy=py(e)-startY;
    if(!decided){
      if(Math.abs(dx)<6&&Math.abs(dy)<6)return;
      if(Math.abs(dy)>Math.abs(dx)){dragging=false;return;}
      decided=true;
      if(dx<0&&i<total-1){dir=1;dragSheet=sheets[i];}
      else if(dx>0&&i>0){dir=-1;dragSheet=sheets[i-1];}
      else {dragging=false;return;}
      dragSheet.classList.remove('anim');
      dragSheet.style.zIndex=total+2;
      // make bending layers follow instantly during drag
      ['.curve','.band','.under'].forEach(sel=>{const el=dragSheet.querySelector(sel);if(el)el.style.transition='none';});
      hideHint();
    }
    if(!dragSheet)return;
    if(e.cancelable)e.preventDefault();
    const ratio=Math.max(0,Math.min(1,Math.abs(dx)/bookW));
    curDeg=(dir===1)? -ratio*180 : -180+ratio*180;
    dragSheet.style.transform='rotateY('+curDeg+'deg)';
    bendFx(dragSheet,Math.abs(curDeg)/180);
  }
  function onUp(){
    if(!dragging){return;}
    dragging=false;
    if(!dragSheet){decided=false;return;}
    const s=dragSheet;dragSheet=null;const d=dir;dir=0;decided=false;
    const p=Math.abs(curDeg)/180;
    animating=true;
    if(d===1){
      if(p>0.4)animateTo(s,-180,()=>{i++;updateChrome();animating=false;});
      else animateTo(s,0,()=>{clearBend(s);s.style.zIndex=total-i;animating=false;});
    }else{
      if(p<0.6)animateTo(s,0,()=>{clearBend(s);s.style.zIndex=total-(i-1);i--;updateChrome();animating=false;});
      else animateTo(s,-180,()=>{s.style.zIndex=total-(i-1);animating=false;});
    }
  }

  fit();
  updateChrome();
  setTimeout(hideHint,5000);
})();
</script>
