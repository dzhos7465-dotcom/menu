<!DOCTYPE html>
<html lang="ru">
<head>

<style>
  :root{ --bg:#0d1f18; --gold:#f2c879; --gold-soft:rgba(242,200,121,.55); --ar:0.7071; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;height:100dvh;width:100%;overflow:hidden;background:var(--bg);
    font-family:"Trebuchet MS",-apple-system,system-ui,sans-serif;position:fixed;inset:0;}
  body{display:flex;flex-direction:column;
    background:radial-gradient(circle at 50% 25%,#163326 0%,#0d1f18 72%);}

  .stage{flex:1;position:relative;overflow:hidden;min-height:0;}
  .book{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);perspective:2200px;}

  /* clean single-sheet page turn */
  .sheet{position:absolute;inset:0;transform-style:preserve-3d;
    transform-origin:left center;}
  .book.turning .sheet{will-change:transform;}
  .sheet.anim{transition:transform .72s cubic-bezier(.62,.02,.24,1);}
  .sheet .face{position:absolute;inset:0;backface-visibility:hidden;
    -webkit-backface-visibility:hidden;border-radius:8px;overflow:hidden;
    box-shadow:0 18px 42px rgba(0,0,0,.55),0 3px 10px rgba(0,0,0,.4);background:var(--bg);
    contain:paint;}
  .book.turning .face{box-shadow:0 8px 20px rgba(0,0,0,.5);}
  .sheet .face img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none;}
  .sheet .front{transform:rotateY(0deg);}
  .sheet .back{transform:rotateY(180deg);
    background:linear-gradient(120deg,#12291f 0%,#0d1f18 55%,#0a1813 100%);}
  .sheet .shade{position:absolute;inset:0;pointer-events:none;border-radius:8px;
    background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,0) 55%);opacity:0;}

  /* ==== smoke / steam ==== */
  .smoke{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden;border-radius:8px;}
  .puff{position:absolute;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.40),rgba(255,255,255,.15) 45%,rgba(255,255,255,0) 72%);
    filter:blur(6px);opacity:0;animation:rise linear infinite;}
  @keyframes rise{
    0%{transform:translateY(24px) scale(.65);opacity:0;}
    22%{opacity:.8;}
    65%{opacity:.48;}
    100%{transform:translateY(-160px) scale(1.8);opacity:0;}
  }

  /* ==== food images: gentle breathing only, no touch reaction ==== */
  .live{position:absolute;pointer-events:none;overflow:hidden;}
  .live .zoomimg{position:absolute;background-repeat:no-repeat;
    animation:breathe 5.5s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.03);}}

  .sheet.idle .smoke,.sheet.idle .live{display:none;}
  .book.turning .smoke,.book.turning .live{display:none;}

  /* contact hot-zones */
  .hot{position:absolute;z-index:8;display:block;border-radius:9px;border:1.5px solid transparent;}
  .hot.glow{animation:tapGlow 1.9s ease-in-out infinite;}
  @keyframes tapGlow{
    0%,100%{box-shadow:0 0 0 0 rgba(242,200,121,0);border-color:rgba(242,200,121,.12);background:rgba(242,200,121,.03);}
    50%{box-shadow:0 0 13px 2px rgba(242,200,121,.42);border-color:rgba(242,200,121,.65);background:rgba(242,200,121,.10);}
  }
  .hot:active{background:rgba(242,200,121,.25)!important;}

  .nav{position:absolute;top:0;bottom:0;width:16%;max-width:130px;z-index:20;display:flex;
    align-items:center;border:none;background:transparent;cursor:pointer;opacity:0;transition:opacity .25s;}
  .stage:hover .nav{opacity:1;}
  .nav.left{left:0;justify-content:flex-start;padding-left:16px;}
  .nav.right{right:0;justify-content:flex-end;padding-right:16px;}
  .nav .chev{width:54px;height:54px;border-radius:50%;background:rgba(13,31,24,.55);
    backdrop-filter:blur(6px);border:1px solid var(--gold-soft);display:flex;align-items:center;
    justify-content:center;transition:transform .2s,background .2s;}
  .nav:hover .chev{background:rgba(13,31,24,.85);transform:scale(1.08);}
  .nav .chev svg{width:24px;height:24px;stroke:var(--gold);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .nav[disabled]{opacity:0!important;pointer-events:none;}

  .bar{flex:0 0 auto;padding:9px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:7px;
    border-top:1px solid rgba(242,200,121,.12);background:rgba(9,23,17,.55);}
  .dots{display:flex;gap:10px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--gold-soft);opacity:.45;
    transition:opacity .3s,transform .3s,background .3s;cursor:pointer;}
  .dot.on{opacity:1;background:var(--gold);transform:scale(1.25);}
  .counter{font-size:12px;letter-spacing:.18em;color:var(--gold);opacity:.75;font-weight:bold;}

  .hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;color:var(--gold);
    font-size:13px;letter-spacing:.14em;background:rgba(13,31,24,.6);backdrop-filter:blur(6px);
    padding:9px 18px;border-radius:30px;border:1px solid var(--gold-soft);display:flex;align-items:center;
    gap:9px;animation:hintPulse 1.7s ease-in-out infinite;transition:opacity .5s;}
  .hint svg{width:20px;height:20px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  @keyframes hintPulse{0%,100%{transform:translateX(-50%) translateX(-6px);}50%{transform:translateX(-50%) translateX(6px);}}
  .hint.hide{opacity:0;pointer-events:none;}

  @media (max-height:520px){
    .bar{padding:6px 16px calc(6px + env(safe-area-inset-bottom));gap:5px;}
    .hint{bottom:10px;padding:7px 14px;font-size:12px;}
  }
  @media (prefers-reduced-motion:reduce){
    .sheet.anim{transition:transform .3s ease;}
    .puff,.hot.glow,.zoomimg,.hint{animation:none;}
  }

  /* ===== order builder ===== */
  .cartbtn{width:100%;max-width:460px;margin-top:3px;
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:15px 20px;border-radius:16px;cursor:pointer;
    background:linear-gradient(140deg,#1c3d2c,#14291f);border:1px solid var(--gold-soft);
    color:var(--gold);font:bold 16px/1 "Trebuchet MS",sans-serif;letter-spacing:.05em;
    box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .18s,box-shadow .18s;}
  .cartbtn:active{transform:scale(.95);}
  .cartbtn svg{width:21px;height:21px;fill:none;stroke:var(--gold);stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;}
  .cartbtn .badge{min-width:24px;height:24px;border-radius:12px;font-weight:bold;background:var(--gold);color:#0d1f18;
    display:none;align-items:center;justify-content:center;font-size:14px;padding:0 7px;}
  .cartbtn.has .badge{display:flex;}

  .panel{position:fixed;inset:0;z-index:70;background:#0b1c15;display:none;flex-direction:column;}
  .panel.open{display:flex;}
  .panel-head{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:14px 16px;
    border-bottom:1px solid rgba(242,200,121,.18);background:#0d2119;}
  .panel-head h2{flex:1;color:var(--gold);font-size:19px;letter-spacing:.08em;font-weight:bold;}
  .xbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--gold-soft);background:transparent;
    color:var(--gold);font-size:24px;line-height:1;cursor:pointer;flex:0 0 auto;}
  .xbtn:active{background:rgba(242,200,121,.15);}

  .tabs{flex:0 0 auto;display:flex;gap:8px;overflow-x:auto;padding:11px 16px;
    border-bottom:1px solid rgba(242,200,121,.14);-webkit-overflow-scrolling:touch;}
  .tabs button{flex:0 0 auto;padding:11px 17px;border-radius:22px;cursor:pointer;white-space:nowrap;
    background:rgba(242,200,121,.07);border:1px solid rgba(242,200,121,.25);color:#e8e2d2;
    font:15px/1 "Trebuchet MS",sans-serif;}
  .tabs button.on{background:var(--gold);border-color:var(--gold);color:#0d1f18;font-weight:bold;}

  .panel-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 24px;}
  .grp{margin-top:18px;}
  .grp h3{color:var(--gold);font-size:16px;letter-spacing:.14em;margin-bottom:8px;text-transform:uppercase;}
  .row{display:flex;align-items:center;gap:12px;padding:14px 0;
    border-bottom:1px solid rgba(255,255,255,.07);}
  .row .nm{flex:1;color:#f0ece1;font-size:17px;line-height:1.3;}
  .row .pr{color:var(--gold);font-size:16px;font-weight:bold;white-space:nowrap;}
  .stp{display:flex;align-items:center;gap:9px;flex:0 0 auto;}
  .stp button{width:40px;height:40px;border-radius:11px;cursor:pointer;font-size:23px;line-height:1;
    background:rgba(242,200,121,.10);border:1px solid rgba(242,200,121,.35);color:var(--gold);}
  .stp button:active{background:rgba(242,200,121,.3);}
  .stp .q{min-width:24px;text-align:center;color:#fff;font-size:18px;font-weight:bold;}
  .stp .minus{visibility:hidden;} .stp.on .minus{visibility:visible;}
  .stp .q{visibility:hidden;} .stp.on .q{visibility:visible;}

  .note{margin-top:16px;padding:15px 17px;border-radius:12px;line-height:1.5;font-size:16px;
    background:rgba(242,200,121,.09);border:1px solid rgba(242,200,121,.32);color:#f2e7cf;}
  .note b{color:var(--gold);}

  .totalbar{flex:0 0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(242,200,121,.2);background:#0d2119;display:flex;flex-direction:column;gap:10px;}
  .totalrow{display:flex;align-items:baseline;justify-content:space-between;color:#f0ece1;font-size:17px;}
  .totalrow b{color:var(--gold);font-size:25px;}
  .actions{display:flex;gap:10px;}
  .actions a,.actions button{flex:1;padding:16px 10px;border-radius:12px;text-align:center;cursor:pointer;
    font:bold 17px/1.2 "Trebuchet MS",sans-serif;text-decoration:none;border:1px solid transparent;}
  .wa{background:var(--gold);color:#0d1f18;}
  .wa.off{opacity:.4;pointer-events:none;}
  .ghost{background:transparent;border-color:rgba(242,200,121,.4);color:var(--gold);}

  .empty{padding:36px 10px;text-align:center;color:#9fb0a6;font-size:17px;line-height:1.5;}
  .sum .row{border-bottom:1px dashed rgba(255,255,255,.12);}
  .sum .qty{color:var(--gold);font-weight:bold;white-space:nowrap;}
  .brandline{display:flex;align-items:baseline;gap:10px;padding-bottom:4px;}
  .brandline .b1{color:var(--gold);font-size:21px;font-weight:bold;letter-spacing:.05em;}
  .brandline .b2{color:#9fb0a6;font-size:14px;}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="book" id="book"></div>

    <button class="nav left" id="prev" aria-label="Назад" disabled>
      <span class="chev"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></span>
    </button>
    <button class="nav right" id="next" aria-label="Вперёд">
      <span class="chev"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>
    </button>

    <div class="hint" id="hint">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      тяните, чтобы листать
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
  </div>

  <div class="bar">
    <div class="dots" id="dots"></div>
    <div class="counter" id="counter">1 / 3</div>
  <button class="cartbtn" id="cartbtn" aria-label="Собрать заказ">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/>
      <path d="M2 3h3l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 7H6"/></svg>
    <span id="cartlabel">Собрать заказ</span>
    <span class="badge" id="badge">0</span>
  </button>
  </div>

  <div class="panel" id="panel" role="dialog" aria-label="Заказ">
    <div class="panel-head">
      <button class="xbtn" id="backbtn" style="display:none" aria-label="Назад">&#8249;</button>
      <h2 id="ptitle">МЕНЮ СПИСКОМ</h2>
      <button class="xbtn" id="closebtn" aria-label="Закрыть">&#215;</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="panel-body" id="pbody"></div>
    <div class="totalbar">
      <div class="totalrow"><span>Итого</span><b id="tot">0 ₽</b></div>
      <div class="actions" id="acts"></div>
    </div>
  </div>

<script>
(function(){
  const IMAGES=['0.jpg','1.jpg','2.jpg','3.jpg'];  // splash, burgers, pizza, rolls
  const AR=0.7071;
  const total=IMAGES.length;

  const WHATSAPP='https://wa.me/79280168111';
  const INSTAGRAM='https://www.instagram.com/_burgerzona_';
  // contacts now live on the SPLASH page (page index 0)
  const HOTZONES=[
    {href:WHATSAPP , x:0.328, y:0.863, w:0.285, h:0.032, label:'Написать в WhatsApp'},
    {href:INSTAGRAM, x:0.326, y:0.897, w:0.297, h:0.034, label:'Открыть Instagram'}
  ];
  const CONTACT_PAGE=0;
  const LIVE={
    1:[[0.84,0.16,0.18],[0.28,0.74,0.20]],
    2:[[0.72,0.33,0.22],[0.27,0.80,0.17]],
    3:[[0.87,0.83,0.17]]
  };
  const SMOKE={
    1:[[0.84,0.20],[0.30,0.68]],
    2:[[0.72,0.38],[0.29,0.76]],
    3:[[0.87,0.77]]
  };

  let i=0, animating=false, bookW=1, bookH=1;
  const stage=document.getElementById('stage');
  const bar=document.querySelector('.bar');
  const book=document.getElementById('book');
  const prevBtn=document.getElementById('prev');
  const nextBtn=document.getElementById('next');
  const dotsWrap=document.getElementById('dots');
  const counter=document.getElementById('counter');
  const hint=document.getElementById('hint');

  /* build one sheet per page */
  const sheets=[];
  for(let idx=0;idx<total;idx++){
    const s=document.createElement('div');
    s.className='sheet anim';
    s.style.zIndex=total-idx;
    const frontSrc=IMAGES[idx];
    s.innerHTML=
      '<div class="face front"><img src="'+frontSrc+'" decoding="async" alt="Меню, страница '+(idx+1)+'">'+
        '<div class="smoke" data-page="'+idx+'"></div>'+
        '<div class="livewrap" data-page="'+idx+'"></div>'+
        (idx===CONTACT_PAGE?'<div class="hotwrap"></div>':'')+
      '</div>'+
      '<div class="face back"></div>'+
      '<div class="shade"></div>';
    book.appendChild(s);
    sheets.push(s);
  }

  for(let idx=0;idx<total;idx++){
    const d=document.createElement('div');
    d.className='dot'+(idx===0?' on':'');
    d.addEventListener('click',()=>jump(idx));
    dotsWrap.appendChild(d);
  }
  const dots=[...dotsWrap.children];

  let lastW=0,lastH=0;
  function fit(){
    const r=stage.getBoundingClientRect();
    const vv=window.visualViewport;
    const winH=(vv?vv.height:window.innerHeight)||r.height;
    const barH=bar?bar.getBoundingClientRect().height:0;
    /* Safari can report a too-short stage on first paint — take the larger of the two */
    const sw=Math.max(r.width||0, document.documentElement.clientWidth||0);
    const sh=Math.max(r.height||0, winH-barH);
    const availW=sw*0.96, availH=sh*0.96;
    let w=availH*AR, hh=availH;
    if(w>availW){ w=availW; hh=availW/AR; }
    if(Math.abs(w-lastW)<1&&Math.abs(hh-lastH)<1)return;   /* nothing changed */
    lastW=w; lastH=hh; bookW=w; bookH=hh;
    book.style.width=w+'px'; book.style.height=hh+'px';
    buildDecor();
  }
  window.addEventListener('resize',fit);
  window.addEventListener('load',fit);
  if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
  if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);
  [60,300,800,1500].forEach(t=>setTimeout(fit,t));
  window.addEventListener('orientationchange',()=>{setTimeout(fit,150);setTimeout(fit,400);});

  function buildDecor(){
    sheets.forEach((s,idx)=>{
      // smoke
      const sm=s.querySelector('.smoke');
      let smHtml='';
      (SMOKE[idx]||[]).forEach((sp,k)=>{
        for(let n=0;n<2;n++){
          const size=64+Math.random()*46;
          const left=(sp[0]*100)+(Math.random()*8-4);
          const top=(sp[1]*100)+(Math.random()*6-3);
          const dur=6+Math.random()*3.5;
          const delay=(k*1.4+n*1.7+Math.random()).toFixed(2);
          smHtml+='<div class="puff" style="left:'+left+'%;top:'+top+'%;width:'+size+'px;height:'+size+'px;'+
                  'animation-duration:'+dur+'s;animation-delay:'+delay+'s"></div>';
        }
      });
      sm.innerHTML=smHtml;

      // live food discs (interactive, no scaling)
      const lw=s.querySelector('.livewrap');
      let lvHtml='';
      (LIVE[idx]||[]).forEach((r,idx2)=>{
        const cx=r[0],cy=r[1],rad=r[2];
        const d=rad*2*bookW;
        const left=(cx*bookW-d/2), top=(cy*bookH-d/2);
        const posX=-(cx*bookW-d/2), posY=-(cy*bookH-d/2);
        const mask='-webkit-mask:radial-gradient(circle at 50% 50%,#000 55%,transparent 72%);mask:radial-gradient(circle at 50% 50%,#000 55%,transparent 72%)';
        lvHtml+='<div class="live" style="left:'+left+'px;top:'+top+'px;width:'+d+'px;height:'+d+'px;'+mask+'">'+
                '<div class="zoomimg" style="left:0;top:0;width:'+d+'px;height:'+d+'px;'+
                'background-image:url('+IMAGES[idx]+');background-size:'+bookW+'px '+bookH+'px;'+
                'background-position:'+posX+'px '+posY+'px;animation-delay:'+(idx2*1.3)+'s"></div></div>';
      });
      lw.innerHTML=lvHtml;

      // hotzones on last page
      const hw=s.querySelector('.hotwrap');
      if(hw){
        let hz=HOTZONES.map(z=>
          '<a class="hot glow" href="'+z.href+'" target="_blank" rel="noopener" aria-label="'+z.label+'" '+
          'style="left:'+(z.x*100)+'%;top:'+(z.y*100)+'%;width:'+(z.w*100)+'%;height:'+(z.h*100)+'%"></a>'
        ).join('');
        hw.innerHTML=hz;
      }
    });
    updateChrome();
  }

  function updateChrome(){
    sheets.forEach((s,idx)=>s.classList.toggle('idle',idx!==i));
    dots.forEach((d,idx)=>d.classList.toggle('on',idx===i));
    counter.textContent=(i+1)+' / '+total;
    prevBtn.disabled=(i===0);
    nextBtn.disabled=(i===total-1);
  }

  /* shade during turn (subtle depth on the flat page, no bending) */
  function fx(sheet,p){
    const shade=sheet.querySelector('.shade');
    if(shade)shade.style.opacity=(0.85*p);
  }
  function clearFx(sheet){
    const shade=sheet.querySelector('.shade');
    if(shade){shade.style.transition='';shade.style.opacity='';}
  }

  function animateTo(sheet,targetDeg,cb){
    book.classList.add('turning');
    sheet.classList.add('anim');
    const p=Math.abs(targetDeg)/180;
    const shade=sheet.querySelector('.shade');
    if(shade)shade.style.transition='opacity .72s';
    requestAnimationFrame(()=>{
      sheet.style.transform='rotateY('+targetDeg+'deg)';
      if(shade)shade.style.opacity=(0.85*p);
    });
    setTimeout(()=>{ book.classList.remove('turning'); if(cb)cb(); },720);
  }

  function next(){
    if(animating||i>=total-1)return;
    animating=true;hideHint();
    const s=sheets[i];
    s.style.zIndex=total+2;
    animateTo(s,-180,()=>{ i++;park(s);updateChrome();animating=false; });
  }
  function prev(){
    if(animating||i<=0)return;
    animating=true;hideHint();
    const s=sheets[i-1];
    unpark(s);
    s.style.zIndex=total+2;
    animateTo(s,0,()=>{ s.style.zIndex=total-(i-1);clearFx(s);i--;updateChrome();animating=false; });
  }
  function jump(target){
    if(animating||target===i)return;
    const step=()=>{ if(i<target)next();else if(i>target)prev();
      if(i!==target)setTimeout(step,120); };
    step();
  }
  function hideHint(){hint.classList.add('hide');}

  /* a fully turned sheet is parked out of sight, so no page shows twice */
  function park(s){ s.style.transition='opacity .28s'; s.style.opacity='0';
    s._parkT=setTimeout(()=>{ s.style.visibility='hidden'; },280); }
  function unpark(s){ clearTimeout(s._parkT); s.style.transition='';
    s.style.opacity=''; s.style.visibility='visible'; }

  prevBtn.addEventListener('click',prev);
  nextBtn.addEventListener('click',next);
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight')next(); if(e.key==='ArrowLeft')prev();
  });

  /* ===== drag to turn (page follows finger, smooth) ===== */
  let dragging=false,decided=false,dir=0,startX=0,startY=0,curDeg=0,dragSheet=null;
  stage.addEventListener('touchstart',onDown,{passive:true});
  stage.addEventListener('touchmove',onMove,{passive:false});
  stage.addEventListener('touchend',onUp,{passive:true});
  stage.addEventListener('mousedown',onDown);
  window.addEventListener('mousemove',e=>{if(dragging)onMove(e);});
  window.addEventListener('mouseup',onUp);
  function px(e){return e.touches?e.touches[0].clientX:e.clientX;}
  function py(e){return e.touches?e.touches[0].clientY:e.clientY;}

  function onDown(e){
    if(animating)return;
    if(e.target&&e.target.closest&&e.target.closest('.hot'))return;
    startX=px(e);startY=py(e);dragging=true;decided=false;dir=0;dragSheet=null;
  }
  function onMove(e){
    if(!dragging)return;
    const dx=px(e)-startX, dy=py(e)-startY;
    if(!decided){
      if(Math.abs(dx)<6&&Math.abs(dy)<6)return;
      if(Math.abs(dy)>Math.abs(dx)){dragging=false;return;}
      decided=true;
      if(dx<0&&i<total-1){dir=1;dragSheet=sheets[i];}
      else if(dx>0&&i>0){dir=-1;dragSheet=sheets[i-1];unpark(dragSheet);}
      else {dragging=false;return;}
      book.classList.add('turning');
      dragSheet.classList.remove('anim');
      dragSheet.style.zIndex=total+2;
      const shade=dragSheet.querySelector('.shade'); if(shade)shade.style.transition='none';
      hideHint();
    }
    if(!dragSheet)return;
    if(e.cancelable)e.preventDefault();
    const ratio=Math.max(0,Math.min(1,Math.abs(dx)/bookW));
    curDeg=(dir===1)? -ratio*180 : -180+ratio*180;
    dragSheet.style.transform='rotateY('+curDeg+'deg)';
    fx(dragSheet,Math.abs(curDeg)/180);
  }
  function onUp(){
    if(!dragging){return;}
    dragging=false;
    if(!dragSheet){decided=false;return;}
    const s=dragSheet;dragSheet=null;const d=dir;dir=0;decided=false;
    const p=Math.abs(curDeg)/180;
    animating=true;
    if(d===1){
      if(p>0.4)animateTo(s,-180,()=>{i++;park(s);updateChrome();animating=false;});
      else animateTo(s,0,()=>{clearFx(s);s.style.zIndex=total-i;animating=false;});
    }else{
      if(p<0.6)animateTo(s,0,()=>{clearFx(s);s.style.zIndex=total-(i-1);i--;updateChrome();animating=false;});
      else animateTo(s,-180,()=>{s.style.zIndex=total-(i-1);park(s);animating=false;});
    }
  }

  fit();
  updateChrome();
  setTimeout(hideHint,5000);
})();
</script>

<script>
(function(){
  const PHONE='79280168111';

  const MENU=[
    {cat:'Бургеры', items:[
      ['Гамбургер',100],['Чизбургер',100],
      ['Гамбургер с домашней котлетой',200],['Чизбургер с домашней котлетой',200],
      ['Криспи-бургер',200],['Бургер в кляре',200],['2-й бургер',150],
      ['Хот-дог',100],['Хот-дог в кляре',200],
      ['Гиро',450],['Кинкер с сыром',200],['Кинкер обычный',150],['Такос',250]
    ]},
    {cat:'Курица и снеки', items:[
      ['Крылышки, 6 шт.',300],['Крылышки, 9 шт.',400],['Крылышки, 20 шт.',900],
      ['Стрипсы, 3 шт.',150],['Стрипсы, 6 шт.',300],['Стрипсы, 9 шт.',350],
      ['Наггетсы, 6 шт.',150],['Наггетсы, 9 шт.',200],['Наггетсы, 20 шт.',400],
      ['Сырные палочки, 6 шт.',200],['Сырные палочки, 9 шт.',250],
      ['Картошка фри',100],['Картошка по-деревенски',100],
      ['Комбо с наггетсами',350],['Комбо с крылышками',450],
      ['Курица гриль',900],['Куриный стейк',450],['Куриный попкорн',250],
      ['Соус',50]
    ]},
    {cat:'Пицца', items:[
      ['Пицца маленькая',300],['Пицца средняя',350],['Пицца большая',400],
      ['Пицца ассорти (большая)',450],
      ['Пицца мясная',400],['Пицца мексиканец',400],['Пицца кольцоне',400],
      ['Пицца куриная',400],['Пицца Цезарь',400],['Пицца Маргарита',400],
      ['Пицца грибная',400],['Пицца 4 сезона',400],['Пицца фри / звёздочка',400],
      ['Пицца пепперони',400],['Пицца 4 сыра',400],
      ['Пицца Филадельфия, маленькая',350],['Пицца Филадельфия, средняя',400],
      ['Пицца Филадельфия, большая',500]
    ]},
    {cat:'Шаурма и салаты', items:[
      ['Шаурма',250],['Шаурма в кляре',250],['Донер',200],
      ['Салат Цезарь',250],['Нарезка',120]
    ]},
    {cat:'Роллы', items:[
      ['Хот-дог ролл',350],['Филадельфия',300],['Тайфун',300],['Эби темпура',300],
      ['Цезарь с креветкой',300],['Fiery Chicken Roll',300],['Black Roll',300],
      ['Калифорния краб',300],['Калифорния с угрем',300],['Калифорния лосось',300],
      ['Красный дракон',350],['Бешеный с креветкой',350],['Бешеный с лососем',300],
      ['Горячий микс',300],['Горячий шик',300],['Темпура маки',300],['Темпура сяки',300],
      ['Ролл сэндвич',300],['Ролл сэндвич с крабом',300],['Ролл сэндвич с креветкой',350],
      ['Ролл американо',300],['Ролл Оки',300],['Ойси',350],['Мексиканский',300],
      ['Цунами',300],['Запечённый лава-ролл',300],['Токио / Маффины',300]
    ]},
    {cat:'Креветки', items:[
      ['Креветки, 6 шт.',350],['Креветки, 9 шт.',500]
    ]}
  ];

  const cart={};                       // "cat|name" -> qty
  let tab=0, view='pick';

  const btn=document.getElementById('cartbtn');
  const badge=document.getElementById('badge');
  const label=document.getElementById('cartlabel');
  const panel=document.getElementById('panel');
  const tabs=document.getElementById('tabs');
  const body=document.getElementById('pbody');
  const totEl=document.getElementById('tot');
  const acts=document.getElementById('acts');
  const title=document.getElementById('ptitle');
  const backBtn=document.getElementById('backbtn');

  const key=(c,n)=>c+'|'+n;
  const money=v=>v.toLocaleString('ru-RU')+' \u20BD';
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function count(){ let n=0; for(const k in cart)n+=cart[k]; return n; }
  function total(){
    let s=0;
    MENU.forEach(g=>g.items.forEach(it=>{ const q=cart[key(g.cat,it[0])]||0; s+=q*it[1]; }));
    return s;
  }
  function lines(){
    const out=[];
    MENU.forEach(g=>g.items.forEach(it=>{
      const q=cart[key(g.cat,it[0])]||0;
      if(q>0)out.push({name:it[0],price:it[1],qty:q,sum:q*it[1]});
    }));
    return out;
  }

  /* ---------- picker ---------- */
  function drawTabs(){
    tabs.innerHTML=MENU.map((g,k)=>'<button data-k="'+k+'"'+(k===tab?' class="on"':'')+'>'+esc(g.cat)+'</button>').join('');
  }
  function drawPicker(){
    const g=MENU[tab];
    let h='<div class="grp"><h3>'+esc(g.cat)+'</h3>';
    g.items.forEach(it=>{
      const k=key(g.cat,it[0]), q=cart[k]||0;
      h+='<div class="row">'+
           '<span class="nm">'+esc(it[0])+'</span>'+
           '<span class="pr">'+money(it[1])+'</span>'+
           '<span class="stp'+(q>0?' on':'')+'" data-key="'+esc(k)+'">'+
             '<button class="minus" data-d="-1" aria-label="Убрать">&#8722;</button>'+
             '<span class="q">'+q+'</span>'+
             '<button data-d="1" aria-label="Добавить">+</button>'+
           '</span>'+
         '</div>';
    });
    h+='</div>';
    h+='<div class="note">Онлайн-заказ пока не работает. Соберите заказ здесь, а потом отправьте его нам '+
       'в WhatsApp одной кнопкой — или сделайте скриншот и пришлите на <b>+7 928 016 81 11</b>.</div>';
    body.innerHTML=h;
  }

  /* ---------- order summary (the screenshot view) ---------- */
  function drawSummary(){
    const ls=lines();
    if(!ls.length){
      body.innerHTML='<div class="empty">Пока ничего не выбрано.<br>Вернитесь в меню и добавьте блюда.</div>';
      return;
    }
    let h='<div class="note" style="margin:14px 0 4px">Заказ через сайт пока <b>не оформляется</b>. '+
          'Нажмите «Отправить в WhatsApp» — заказ подставится в сообщение сам. '+
          'Либо сделайте <b>скриншот этого экрана</b> и отправьте на <b>+7 928 016 81 11</b>.</div>'+
          '<div class="grp sum"><div class="brandline"><span class="b1">Бургер Зона</span>'+
          '<span class="b2">твоя территория вкуса</span></div>';
    ls.forEach(l=>{
      h+='<div class="row"><span class="nm">'+esc(l.name)+'</span>'+
         '<span class="qty">&#215;'+l.qty+'</span>'+
         '<span class="pr">'+money(l.sum)+'</span></div>';
    });
    h+='</div>';
    body.innerHTML=h;
  }

  function orderText(){
    const ls=lines();
    let t='Здравствуйте! Хочу сделать заказ:\n\n';
    ls.forEach(l=>{ t+='• '+l.name+' \u00D7 '+l.qty+' — '+l.sum+' \u20BD\n'; });
    t+='\nИтого: '+total()+' \u20BD';
    return t;
  }

  /* totals + buttons only — the list is left alone so the tapped button survives */
  function renderChrome(){
    const n=count(), s=total();
    badge.textContent=n;
    btn.classList.toggle('has',n>0);
    label.textContent=n>0?'Заказ':'Собрать заказ';
    totEl.textContent=money(s);
    if(view==='pick'){
      acts.innerHTML='<button class="wa'+(n?'':' off')+'" id="go">К заказу'+(n?' ('+n+')':'')+'</button>'+
                     (n?'<button class="ghost" id="clr">Очистить</button>':'');
    }else{
      acts.innerHTML='<a class="wa'+(n?'':' off')+'" id="wa" target="_blank" rel="noopener" href="'+
                     'https://wa.me/'+PHONE+'?text='+encodeURIComponent(orderText())+'">Отправить в WhatsApp</a>'+
                     (n?'<button class="ghost" id="clr">Очистить</button>':'');
    }
  }
  function render(){
    tabs.style.display=(view==='pick')?'flex':'none';
    backBtn.style.display=(view==='pick')?'none':'block';
    title.textContent=(view==='pick')?'МЕНЮ СПИСКОМ':'ВАШ ЗАКАЗ';
    if(view==='pick'){ drawTabs(); drawPicker(); } else { drawSummary(); }
    renderChrome();
  }

  /* ---------- events ---------- */
  btn.addEventListener('click',()=>{ view='pick'; panel.classList.add('open'); render(); });
  document.getElementById('closebtn').addEventListener('click',()=>panel.classList.remove('open'));
  backBtn.addEventListener('click',()=>{ view='pick'; render(); });

  tabs.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    tab=+b.dataset.k; render();
  });

  body.addEventListener('click',e=>{
    const b=e.target.closest('.stp button'); if(!b)return;
    const stp=b.parentNode, k=stp.dataset.key, d=+b.dataset.d;
    const q=Math.max(0,(cart[k]||0)+d);
    if(q)cart[k]=q; else delete cart[k];
    stp.querySelector('.q').textContent=q;
    stp.classList.toggle('on',q>0);
    renderChrome();
  });

  acts.addEventListener('click',e=>{
    if(e.target.id==='go'){ view='order'; render(); body.scrollTop=0; }
    if(e.target.id==='clr'){ for(const k in cart)delete cart[k]; view='pick'; render(); }
  });

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&panel.classList.contains('open'))panel.classList.remove('open');
  });

  render();
})();
</script>
